services:
  mongodb:
    image: mongo:7.0
    container_name: factoryflow_mongodb
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate() }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Service temporaire pour initialiser le Replica Set automatiquement au premier lancement
  mongo-init:
    image: mongo:7.0
    container_name: factoryflow_mongo_init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh --host mongodb:27017 --eval '
        try {
          rs.status();
        } catch (e) {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          });
        }
      '

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factoryflow_backend
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=:5000
      - NODE_ENV= NODE_ENV:-development
      - MONGO_URI=://mongodb:27017/factoryflow?replicaSet=rs0
      - JWT_SECRET=J6ab362830b125c9fdd421a56cf35447d3f43ad4cedd8a4e9e19edfe6b928ec3d
      - JWT_EXPIRES_IN=30
    volumes:
      # Montage du code local dans le conteneur pour le hot-reload
      - .:/app
      # Isolation des node_modules du conteneur par rapport à la machine hôte
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data: